<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Manager</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: url('splash-bg.png') no-repeat center center;
      background-size: cover;
      background-color: #1a1a1b; /* Dark native feel fallback */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .content {
      text-align: center;
      /* Add a slight backdrop to make logo pop if background is busy, purely optional but good for readability */
      /* background: rgba(0, 0, 0, 0.2); */
      /* padding: 40px; */
      /* border-radius: 20px; */
      /* backdrop-filter: blur(10px); */
    }
    img {
      width: 120px; 
      height: auto;
      margin-bottom: 20px;
      /* Optional: formatting for the logo if it needs to pop more */
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .loader {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2); 
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }
    .loader::after {
      content: '';
      position: absolute;
      width: 40%;
      height: 100%;
      background: #0078d4; /* Windows Blue */
      background: linear-gradient(90deg, #0078d4, #00bcf2);
      animation: loading 1.5s infinite ease-in-out;
      border-radius: 10px;
    }
    @keyframes loading {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="content">
    <img src="logo.png" alt="Staff Manager Logo">
    <div class="loader"></div>
  </div>
</body>
</html>
